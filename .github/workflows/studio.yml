name: AI Game Studio Sprint
on:
  workflow_dispatch:
  schedule:
    - cron: '0 6 * * *'
permissions:
  contents: write
  issues: write
concurrency:
  group: ai-game-studio
  cancel-in-progress: false
jobs:
  sprint:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v4
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - name: Run studio
        run: python studio.py
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          GEMINI_MODEL: gemini-3.8-flash
          MODEL_CHAIN: "gemini:gemini-3.8-flash,gemini:gemini-3.7-flash,openrouter:z-ai/glm-5.2:free"
          GH_TOKEN: ${{ github.token }}
      - name: Commit results
        if: always()
        run: |
          git config user.name 'ai-game-studio[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --quiet || git commit -m "chore: studio sprint output"
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
